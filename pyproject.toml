[project]
name = "mqtt-kafka-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <4"
dependencies = [
    "aiocache>=0.12.3",
    "aiohttp>=3.11.16",
    "aiokafka>=0.12.0",
    "aiomqtt>=2.3.2",
    "aioprometheus>=23.12.0",
    "aiosignal>=1.3.2",
    "anyio>=4.9.0",
    "async-timeout>=5.0.1",
    "attrs>=25.3.0",
    "casefy>=1.0.0",
    "certifi>=2025.1.31",
    "dacite>=1.9.2",
    "dataclasses-avroschema>=0.65.10",
    "fastavro>=1.10.0",
    "frozenlist>=1.5.0",
    "h11>=0.14.0",
    "httpcore>=1.0.8",
    "httpx>=0.28.1",
    "idna>=3.10",
    "inflector>=3.1.1",
    "multidict>=6.4.3",
    "orjson>=3.10.16",
    "packaging>=24.2",
    "paho-mqtt>=2.1.0",
    "python-dotenv>=1.1.0",
    "quantile-python>=1.1",
    "sentry-sdk>=2.26.1",
    "sniffio>=1.3.1",
    "typing-extensions>=4.13.2",
    "urllib3>=2.4.0",
    "yarl>=1.19.0",
]

[dependency-groups]
dev = [
    "deepdiff>=8.4.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-env>=1.1.5",
    "ruff>=0.11.5",
]

[project.scripts]
mkc = "mqtt_kafka_connector.connector.main:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
